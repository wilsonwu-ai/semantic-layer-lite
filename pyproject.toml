[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-layer-lite"
version = "0.1.0"
description = "A tiny semantic layer for SQLite: approve the joins and metrics once, then every agent question compiles to one safe query."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wilson Wu" }]
dependencies = []

[project.scripts]
semantic-layer-lite = "semantic_layer_lite.cli:main"

[tool.setuptools]
packages = ["semantic_layer_lite"]
